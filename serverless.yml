service: frontend-app

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev

plugins:
  - serverless-s3-sync
custom:
  s3Sync:
    - bucketName: local-test-frontend-app
      localDir: build
resources:
  Resources:
    FrontendS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: local-test-frontend-app
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
